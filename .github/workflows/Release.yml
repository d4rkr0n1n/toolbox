name: Release
on:
  push:
    branches: [ "dev" , "main" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Get version
        if: ${{ github.ref_name == 'dev' }}
        id: extract_version
        run: |
          git fetch --tags
          latest_tag=$(git tag | tail -n 1)
          major=$(echo "$latest_tag" | awk -F'[v.]' '{print $2}')
          minor=$(echo "$latest_tag" | awk -F'[v.]' '{print $3}')
          patch=$(echo "$latest_tag" | awk -F'[v.]' '{print $4}')
          patch=$((($patch + 1) % 10))
          if [ $patch -eq 0 ]; then
            minor=$((($minor + 1) % 10))
            if [ $minor -eq 0 ]; then
              major=$((($major + 1) % 10))
            fi
          fi
          echo "version=v$major.$minor.$patch" >> $GITHUB_OUTPUT
      - name: Get Tags
        if: ${{ github.ref_name == 'main' }}
        id: tags
        run: |
          git fetch --tags
          latest_tag=$(git tag | tail -n 1)
          major=$(echo "$latest_tag" | awk -F'[v.]' '{print $2}')
          minor=$(echo "$latest_tag" | awk -F'[v.]' '{print $3}')
          patch=$(echo "$latest_tag" | awk -F'[v.]' '{print $4}')
          patch=$((($patch + 1) % 10))
          if [ $patch -eq 0 ]; then
            minor=$((($minor + 1) % 10))
            if [ $minor -eq 0 ]; then
              major=$((($major + 1) % 10))
            fi
          fi
          echo "version=v$major.$minor.$patch" >> $GITHUB_OUTPUT
      - name: Create Release
        if: ${{ github.ref_name == 'dev' }}
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.extract_version.outputs.version }}
          release_name: Release ${{ steps.extract_version.outputs.version }}
          draft: false
          prerelease: false
      - name: Create Release
        if: ${{ github.ref_name == 'main' }}
        id: create_release-1
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tags.outputs.version }}
          release_name: Release ${{ steps.tags.outputs.version }}
          draft: false
          prerelease: false
